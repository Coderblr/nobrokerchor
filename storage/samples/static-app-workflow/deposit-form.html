<!DOCTYPE html>
<html>
<head><title>NBC Demo Workflow - Cash Deposit</title></head>
<body>
  <h1>Cash Deposit</h1>
  <form onsubmit="event.preventDefault(); window.location.href='confirmation.html';">
    <label for="accountNumber">Account Number</label>
    <input id="accountNumber" name="accountNumber" type="text">
    <label for="depositAmount">Deposit Amount</label>
    <input id="depositAmount" name="depositAmount" type="number">
    <button type="submit">Submit</button>
  </form>
</body>
</html>
